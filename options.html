<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Monsnode Multi Player — Playback Options</title>
  <style>
    :root{color-scheme:dark;--bg:#101114;--panel:#191a1f;--line:#303139;--muted:#a2a3ad;--text:#f4f4f6;--accent:#c4f26a}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,sans-serif}.wrap{max-width:940px;margin:40px auto;padding:0 20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}h1{font-size:23px;margin:0 0 6px}p{color:var(--muted);margin:0 0 22px}.row{display:grid;grid-template-columns:minmax(160px,1fr) 100px 170px 125px 36px;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}select,input{width:100%;background:#101115;color:var(--text);border:1px solid #41424b;border-radius:8px;padding:9px 10px}.key{text-align:center;text-transform:uppercase}.value{font-variant-numeric:tabular-nums}.remove{width:34px;height:34px;border:1px solid #45464e;border-radius:8px;background:#292a30;color:#fff;font-size:18px;cursor:pointer}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;align-items:center}.button{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer}.save{background:var(--accent);color:#18200f}.secondary{background:#303139;color:var(--text)}#status{color:var(--accent);font-size:12px}.note{font-size:12px;margin-top:18px}.empty{color:var(--muted);font-size:13px;padding:20px 0}@media(max-width:760px){.row{grid-template-columns:1fr 80px 1fr 100px 34px;gap:6px}.panel{padding:16px}}
  </style>
</head>
<body>
  <main class="wrap"><section class="panel">
    <h1>Monsnode Multi Player</h1>
    <p>Playback shortcuts for videos in the multi player. Choose an action, assign a key, and set its value.</p>
    <div class="row" aria-hidden="true"><strong>Action</strong><strong>Key</strong><strong>Value</strong><strong>Unit</strong><span></span></div>
    <div id="rows"></div>
    <div class="actions"><button class="button secondary" id="add">Add binding</button><button class="button save" id="save">Save options</button><button class="button secondary" id="reset">Restore defaults</button><span id="status" role="status"></span></div>
    <p class="note">Keyboard shortcuts work in the video frame that has focus. Click a video before using a shortcut.</p>
  </section></main>
  <script src="options.js"></script>
</body>
</html>
